[package]
name = "p3"
version = "0.1.0"
edition = "2021"
description = "High-performance, low-overhead web proxy with hierarchical (global/department/individual) domain access control"
license = "MIT"

[[bin]]
name = "p3"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ipnet = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bytes = "1"

# TLS stack for MITM mode (ring backend everywhere to keep builds portable)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["pem", "x509-parser", "ring"] }
webpki-roots = "0.26"

# Transparent mode: SO_ORIGINAL_DST
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
